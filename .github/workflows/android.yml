name: Android

on:
  push:
    branches: [main]
    tags: ['v*-android-beta']
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm test
      - run: npm run build:android-runtime
      - run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Compile Room, Compose, and WebView instrumentation
        run: ./android/gradlew -p android :app:assembleDebugAndroidTest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [debug, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build:android-runtime
      - run: ./android/gradlew -p android :app:assembleDebug
      - name: Verify upgrade-compatible signing certificate
        env:
          EXPECTED_CERT_SHA256: 555cd54c5a83ee3cc978ba407105632dd33f4de28521802821384e40eafbd8ee
        run: |
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}')"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate cannot upgrade existing beta installs."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   ${actual:-missing}"
            exit 1
          fi
      - name: Prepare release assets
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            xiaoshuo-yijian-huanming-android-0.2.1-debug.apk
          sha256sum xiaoshuo-yijian-huanming-android-0.2.1-debug.apk \
            > xiaoshuo-yijian-huanming-android-0.2.1-debug.apk.sha256
      - name: Publish Android beta prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Android 0.2.1 EPUB 兼容与首页优化测试版
          prerelease: true
          body: |
            ## 正确下载方式

            请下载 `xiaoshuo-yijian-huanming-android-0.2.1-debug.apk`。
            不要下载 GitHub 自动生成的 `Source code`，它不是可安装包。

            已安装旧测试版的用户可从 `0.1.1 (2)` 或 `0.2.0 (3)` 直接覆盖升级到 `0.2.1 (4)`，无需卸载，规则和阅读记录会保留。

            ## 主要修复

            - 修复部分 Android 文件提供方把 EPUB 标记为 ZIP 后无法选择或打开的问题。
            - 兼容 EPUB 3 的 HTML5 DOCTYPE，并安全保留正文缩进和无缩进段落。
            - 优化首页主次操作、最近阅读空状态以及横屏和大字体滚动体验。
          files: |
            xiaoshuo-yijian-huanming-android-0.2.1-debug.apk
            xiaoshuo-yijian-huanming-android-0.2.1-debug.apk.sha256
